name: Phase 2 Sync Check

on:
  push:
    branches:
      - phase2-sync-performance
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sync function
        run: deno check supabase/functions/sync-eala/index.ts
