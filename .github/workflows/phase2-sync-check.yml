name: Phase 2 Sync Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sync function
        id: check
        shell: bash
        continue-on-error: true
        run: |
          deno check supabase/functions/sync-eala/index.ts > deno-check.log 2>&1
          status=$?
          cat deno-check.log
          exit $status
      - name: Comment compiler output on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('deno-check.log') ? fs.readFileSync('deno-check.log', 'utf8') : 'No compiler output was captured.';
            const body = `<!-- phase2-deno-check -->\n## Phase 2 Deno check\n\n\`\`\`text\n${output.slice(0, 12000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes('<!-- phase2-deno-check -->'));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
      - name: Fail if type-check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
