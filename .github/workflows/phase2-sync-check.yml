name: Phase 2 Sync Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sync function
        id: check
        shell: bash
        run: |
          set +e
          deno check supabase/functions/sync-eala/index.ts > deno-check.log 2>&1
          status=$?
          cat deno-check.log
          exit $status
      - name: Preserve compiler output for diagnosis
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno-check.log
          git diff --cached --quiet && exit 0
          git commit -m "Record Deno check output [skip ci]"
          git push
