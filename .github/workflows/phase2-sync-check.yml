name: Phase 2 Sync Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sync function
        id: check
        shell: bash
        run: |
          set +e
          deno check supabase/functions/sync-eala/index.ts > deno-check.log 2>&1
          status=$?
          cat deno-check.log
          exit $status
      - name: Publish compiler output
        if: always()
        shell: bash
        run: |
          echo "## Deno check output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat deno-check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
